# Lance tous les tests à chaque envoi (onglet Actions). Python 3.10 : proche de ce que
# tourne sur Android ; 3.12 : une version récente.
name: Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python tests/tout.py
