# Construit le jeu pour Android avec buildozer (python-for-android).
#
#  - À chaque envoi sur main : un APK de TEST, à télécharger dans l'onglet Actions
#    (cliquer sur l'exécution, puis « Artifacts » en bas de la page).
#  - À la demande (Actions > Android > Run workflow, case « publication ») ou quand on pousse
#    une étiquette v1.6.0 : en plus, l'AAB SIGNÉ à envoyer sur Google Play. Il faut d'abord
#    créer les secrets du dépôt (Settings > Secrets and variables > Actions) : voir PUBLICATION.md.
#
# La première construction prend 30 à 60 minutes (SDK, NDK, compilation de Python et de SDL) ;
# ensuite, le cache la raccourcit beaucoup.
name: Android
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publication:
        description: "Construire aussi l'AAB signé pour Google Play"
        type: boolean
        default: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Outils système nécessaires à python-for-android
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev lld
      - name: Buildozer
        run: pip install -r requirements-build.txt
      - name: Cache (SDK, NDK, compilations)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec', 'requirements-build.txt') }}
          restore-keys: buildozer-

      - name: APK de test
        run: yes | buildozer android debug
      - name: Vérifier l'APK (16 Ko, version d'Android visée)
        run: python outils/verifier_paquet.py bin/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-de-test
          path: bin/*.apk
          if-no-files-found: error

      - name: AAB signé pour Google Play
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publication
        env:
          CLE_ENVOI_BASE64: ${{ secrets.CLE_ENVOI_BASE64 }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.CLE_ENVOI_ALIAS }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.CLE_ENVOI_MOT_DE_PASSE }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.CLE_ENVOI_MOT_DE_PASSE }}
        run: |
          if [ -z "$CLE_ENVOI_BASE64" ]; then
            echo "::error::Secret CLE_ENVOI_BASE64 manquant : voir PUBLICATION.md"; exit 1
          fi
          echo "$CLE_ENVOI_BASE64" | base64 -d > "$RUNNER_TEMP/cle-envoi.jks"
          export P4A_RELEASE_KEYSTORE="$RUNNER_TEMP/cle-envoi.jks"
          yes | buildozer android release
          python outils/verifier_paquet.py bin/*.aab
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publication
        with:
          name: aab-google-play
          path: bin/*.aab
          if-no-files-found: error
